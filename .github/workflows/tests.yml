name: Experiment suite
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build
      - run: docker build --target test -f docker/Dockerfile -t mm-sae:test .
      - run: docker run --rm mm-sae:test
      - run: make smoke
      - run: make run SAE="$PWD/runs/smoke/sae/models" ARGS="run configs/smoke.yaml --output runs/reuse"
