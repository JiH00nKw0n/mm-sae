output: ../runs/coco-rq1
data:
  source: coco
  root: ../data/coco
  download: true
  label_scope: model_input
  reviewed_captions: null
encoder:
  backend: clip
  model_id: openai/clip-vit-base-patch32
  revision: 3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
  device: cuda
  batch_size: 128
training:
  split: train2017
  sampling: unique_image_all_text
  latent_size: 4096
  top_k: 8
  arguments:
    num_train_epochs: 30
    per_device_train_batch_size: 1024
    learning_rate: 0.0005
    weight_decay: 1.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-08
    optim: adamw_torch
    lr_scheduler_type: cosine
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    seed: 0
    data_seed: 0
    eval_strategy: 'no'
    save_strategy: epoch
    logging_strategy: epoch
    save_total_limit: 2
    dataloader_num_workers: 0
    dataloader_drop_last: false
features:
  mask_rgb:
  - 255
  - 255
  - 255
experiment:
  name: rq1
  options:
    selection_split: train2017
    correlation_split: train2017
    validation_split: val2017
    label_correlation: image_image
    bin_width: 0.2
    intervention_repeats: 5
    intervention_seed: 0
    area_strata: 5
cache: ../cache
