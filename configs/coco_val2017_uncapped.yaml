# Keep every fitted coefficient. Select VG objects after constructing the original region population.
extends: paper.yaml
output: ../runs/uncapped-concepts
concept_feature_budget: null
opposite_direct_concept_coordinates: true
benchmarks:
  stuff:
    dataset: stuff
    files:
      train_instances: coco/annotations/instances_train2017.json
      test_instances: coco/annotations/instances_val2017.json
      train_images: coco/train2017
      test_images: coco/val2017
      stuff_names: stuff/labels.txt
      train_masks: stuff/train2017
      test_masks: stuff/val2017
    min_train_positives: 20
    diagnostics: true
  visual_genome:
    dataset: visual_genome
    files:
      metadata: vg/image_data.json
      graphs: vg/region_graphs.json
      coco_test_instances: coco/annotations/instances_val2017.json
      coco_train_instances: coco/annotations/instances_train2017.json
    min_train_positives: 1
    diagnostics: true
    min_test_images: 50
    regions:
      images: coco_trainval
      label_types:
      - object
      - relation
      annotated_only: true
    evaluation_label_prefix: object/
  coco_retrieval:
    dataset: coco_retrieval
    files:
      captions: coco/annotations/captions_val2017.json
      images: coco/val2017
  flickr30k:
    dataset: flickr30k
    files:
      karpathy: flickr30k/dataset_flickr30k.json
      images: flickr30k/images
  docci:
    dataset: docci
    files:
      captions: docci/docci_descriptions.jsonlines
      images: docci/images
  iiw:
    dataset: iiw
    files:
      captions: iiw/data.jsonl
      images: iiw/images_aar
