smoke: true
output: ../runs/smoke
data_root: ../runs/fixture
paired_cache: ../runs/paired
source:
  dataset_id: fixture/colors
  revision: '1111111111111111111111111111111111111111'
  shard_paths:
  - colors.tar
  batch_size: 16
encoder:
  backend: synthetic
  device: cpu
  synthetic_dim: 16
  batch_size: 32
  text_max_length: 10
training:
  latent_size: 16
  top_k: 4
  arguments:
    max_steps: 8
    per_device_train_batch_size: 16
    disable_tqdm: true
    save_strategy: steps
    save_steps: 4
mapping:
  method: cca
  rank: 3
  ridge: 1.0
  rotation: covariance
  max_iter: 30
benchmarks:
  coco:
    dataset: coco
    files:
      train_instances: train.json
      test_instances: test.json
      train_images: images
      test_images: images
    min_train_positives: 2
    diagnostics: true
  stuff:
    dataset: stuff
    files:
      train_instances: train.json
      test_instances: test.json
      train_images: images
      test_images: images
      stuff_names: names.txt
      train_masks: masks
      test_masks: masks
    min_train_positives: 2
    diagnostics: true
  visual_genome:
    dataset: visual_genome
    files:
      metadata: meta.json
      graphs: graphs.json
      coco_test_instances: test.json
    min_train_positives: 2
    diagnostics: true
  cub:
    dataset: cub
    files:
      attribute_names: attributes.txt
      partition: partition.txt
      images_list: images.txt
      attributes: image_attributes.txt
      images: images
    min_train_positives: 2
    diagnostics: true
  syncoco:
    dataset: syncoco
    files:
      instances: train.json
      metadata: syncoco.csv
      images_root: .
  syncub:
    dataset: syncub
    files:
      attribute_names: attributes.txt
      metadata: syncub.csv
      images_root: .
  coco_retrieval:
    dataset: coco_retrieval
    files:
      captions: captions.json
      images: images
  flickr30k:
    dataset: flickr30k
    files:
      karpathy: flickr.json
      images: images
  docci:
    dataset: docci
    files:
      captions: docci.jsonl
      images: images
  iiw:
    dataset: iiw
    files:
      captions: iiw.jsonl
      images: images
