[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-sae"
version = "0.1.0"
description = "Frozen multimodal SAE correspondence experiments with COCO-Stuff interventions"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.6.0", "numpy==2.1.3", "scipy==1.14.1",
  "Pillow==11.1.0", "PyYAML==6.0.2", "pydantic==2.10.6",
  "matplotlib==3.10.1", "transformers==4.50.3", "huggingface-hub==0.29.3",
  "tqdm==4.67.1", "accelerate==1.5.2", "datasets==3.4.1"
]
[project.optional-dependencies]
dev = [
    "pyright==1.1.408",
    "pytest==8.3.5",
    "ruff==0.11.2",
]
annotation = [
    "jsonschema==4.26.0",
    "openai==3.13.0",
    "python-dotenv==1.2.3",
]
[project.scripts]
mm-sae = "mm_sae.cli:main"
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mm_sae*", "experiments*"]
namespaces = false
[tool.setuptools.package-data]
mm_sae = ["resources/*.yaml"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["src", "experiments", "tests", "scripts"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
